name: Actualización semanal NFL Predictor

on:
  schedule:
    # Todos los martes 09:00 UTC (03:00 hora CDMX / Ciudad de México).
    # Se elige martes porque es cuando ya se conocen resultados del
    # lunes por la noche (MNF) y suele publicarse el primer reporte de
    # lesiones de la semana. Ajusta el cron si prefieres otro día/hora:
    # https://crontab.guru
    - cron: "0 9 * * 2"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: 1. Descargar datos actualizados (ingest)
        run: python src/ingest.py --start-season 2016

      - name: 2. Reconstruir features (anti-leakage)
        run: python src/features.py

      - name: 3. Reentrenar modelo con datos frescos
        run: python src/train.py

      - name: 4. Generar predicciones de la próxima semana
        run: python src/predict.py

      - name: Commitear datos y predicciones actualizadas
        run: |
          git config user.name "nfl-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ models/ dashboard/data/
          git diff --staged --quiet || git commit -m "Actualización automática semanal: $(date -u +'%Y-%m-%d')"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir dashboard como artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
